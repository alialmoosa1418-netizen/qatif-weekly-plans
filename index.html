<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطط الأسبوعية | مدارس القطيف الأهلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:#f4f7f9;color:#15323e}header{background:linear-gradient(120deg,#083b4c,#087f8c);color:#fff;padding:22px}header h1{margin:0}nav{display:flex;gap:8px;margin-top:16px}button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:#087f8c;color:#fff}nav button{background:#ffffff22}.active{background:#fff!important;color:#075a68!important}main{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:17px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #0000000c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}label{display:block;font-weight:700;margin-bottom:5px}select,input,textarea{width:100%;padding:11px;border:1px solid #d5e0e4;border-radius:9px}textarea{min-height:65px}.hide{display:none}.week{width:100%;border-collapse:collapse}.week th,.week td{border:1px solid #dfe8eb;padding:9px;vertical-align:top}.week th{background:#eaf5f6}.subject{font-weight:800;color:#086d78}.small{font-size:13px;color:#65757c}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.stat{text-align:center;background:#eef8f8;border-radius:12px;padding:14px}.stat b{display:block;font-size:25px}.teacherItem{border:1px solid #e1e9ec;border-radius:13px;padding:12px;margin:8px 0}.mobileDays{display:none}@media(max-width:700px){header{padding:16px}nav button{flex:1;padding:10px 4px}.desktopWeek{display:none}.mobileDays{display:block}.day{margin-bottom:14px}.period{padding:11px;border-bottom:1px solid #e7edef}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>الخطط الأسبوعية</h1><div>مدارس القطيف الأهلية – المرحلة المتوسطة</div><nav><button class="active" onclick="page('parent',this)">ولي الأمر</button><button onclick="page('teacher',this)">المعلم</button><button onclick="page('admin',this)">الإدارة</button></nav></header><main>
<section id="parent"><div class="card"><h2>عرض الخطة الأسبوعية</h2><div class="grid"><div><label>الصف</label><select id="pg"></select></div><div><label>الفصل</label><select id="pc"></select></div><div><label>الأسبوع</label><select id="pw"></select></div></div><div id="parentPlan"></div></div></section>
<section id="teacher" class="hide"><div id="tlogin" class="card"><h2>دخول المعلم</h2><div class="grid"><div><label>اسم المعلم</label><select id="tn"></select></div><div><label>رمز الدخول</label><input id="tp" inputmode="numeric" maxlength="4" type="password" placeholder="4 أرقام"></div></div><p class="small">عند الدخول لأول مرة استخدم 0000، ثم عيّن رمزك الخاص.</p><button onclick="tLogin()">دخول</button><p id="tm"></p></div><div id="tchange" class="card hide"><h2>تعيين رمز جديد</h2><input id="newpin" inputmode="numeric" maxlength="4" type="password" placeholder="رمز جديد من 4 أرقام"><button onclick="changePin()">حفظ الرمز</button></div><div id="tapp" class="hide"><div class="card"><h2 id="hello"></h2><label>الأسبوع</label><select id="tw"></select></div><div id="schedule"></div><button onclick="savePlans()">حفظ الخطة الأسبوعية</button></div></section>
<section id="admin" class="hide"><div id="alogin" class="card"><h2>دخول الإدارة</h2><div class="grid"><input id="ae" type="email" placeholder="البريد الإلكتروني"><input id="ap" type="password" placeholder="كلمة المرور"></div><button onclick="aLogin()">دخول</button><p id="am"></p></div><div id="aapp" class="hide"><div class="card"><h2>لوحة الإدارة</h2><div id="astats" class="stats"></div></div><div class="card"><h2>المعلمون ورموز الدخول</h2><div id="alist"></div></div><button onclick="aLogout()">تسجيل الخروج</button></div></section></main><script>
const API='https://mbnvdwiqdqyclmubiqof.supabase.co/functions/v1/weekly-plans';const sb=supabase.createClient('https://mbnvdwiqdqyclmubiqof.supabase.co','sb_publishable_P9PHSRiPaCyeHbQjW0IM8w_UfDPQ_B1');let boot,token='',entries=[];const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
function page(id,b){['parent','teacher','admin'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function get(q,opt={}){let r=await fetch(API+'?api='+q,opt);return r.json()}async function init(){boot=await get('bootstrap');pg.innerHTML=[1,2,3].map(x=>`<option value=${x}>${['','الأول المتوسط','الثاني المتوسط','الثالث المتوسط'][x]}</option>`).join('');fillClasses();pw.innerHTML=tw.innerHTML=boot.weeks.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');let t=await get('teachers');tn.innerHTML=t.teachers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');pg.onchange=fillClasses;pc.onchange=pw.onchange=loadParent;tw.onchange=renderTeacher;loadParent()}
function fillClasses(){pc.innerHTML=boot.classes.filter(x=>x.grade==pg.value).map(x=>`<option value="${x.id}">${x.display_name}</option>`).join('');loadParent()}
async function loadParent(){if(!pc.value||!pw.value)return;let x=await get(`plans&class_id=${pc.value}&week_id=${pw.value}`),m={};(x.plans||[]).forEach(p=>m[p.day.day_of_week+'-'+p.day.period_number]=p);let max=Math.max(...boot.days.map(d=>d.period_count),6),desk='<div class="desktopWeek"><table class=week><tr><th>الحصة</th>'+days.map(d=>'<th>'+d+'</th>').join('')+'</tr>';for(let n=1;n<=max;n++){desk+=`<tr><th>${n}</th>`+days.map((d,i)=>cell(m[(i+1)+'-'+n])).join('')+'</tr>'}desk+='</table></div>';let mob='<div class=mobileDays>'+days.map((d,i)=>`<div class="card day"><h3>${d}</h3>`+Array.from({length:boot.days[i]?.period_count||6},(_,n)=>`<div class=period><b>الحصة ${n+1}</b>${cellBody(m[(i+1)+'-'+(n+1)])}</div>`).join('')+'</div>').join('')+'</div>';parentPlan.innerHTML=desk+mob}
function cell(p){return '<td>'+cellBody(p)+'</td>'}function cellBody(p){if(!p)return '<div class=small>—</div>';return `<div class=subject>${p.subject?.name||''}</div>${p.lesson_topic?'<div>'+esc(p.lesson_topic)+'</div>':''}${p.homework?'<div class=small>المطلوب: '+esc(p.homework)+'</div>':''}`}
async function tLogin(){let x=await get('teacher-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({teacher_id:tn.value,pin:tp.value})});if(x.error){tm.textContent=x.error;return}token=x.token;hello.textContent='مرحبًا، '+x.teacher.name;tlogin.classList.add('hide');if(x.must_change_pin)tchange.classList.remove('hide');else openTeacher()}
async function changePin(){let x=await get('teacher-change-pin',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({new_pin:newpin.value})});if(x.error)return alert(x.error);tchange.classList.add('hide');openTeacher()}
async function openTeacher(){tapp.classList.remove('hide');let x=await get('teacher-schedule',{headers:{authorization:'Bearer '+token}});entries=x.entries||[];renderTeacher()}
function renderTeacher(){schedule.innerHTML=entries.map(e=>`<div class="card plan" data-id="${e.id}"><b>${days[e.day_of_week-1]} – الحصة ${e.period_number}</b><div class=subject>${e.subject.name} | ${e.class.display_name}</div><label>عنوان الدرس</label><input class=topic><label>الواجب / المطلوب</label><input class=hw><label>ملاحظات</label><textarea class=notes></textarea></div>`).join('')}
async function savePlans(){let items=[...document.querySelectorAll('.plan')].map(d=>({schedule_entry_id:d.dataset.id,lesson_topic:d.querySelector('.topic').value,homework:d.querySelector('.hw').value,notes:d.querySelector('.notes').value}));let x=await get('teacher-save',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({week_id:tw.value,items})});alert(x.ok?'تم حفظ الخطة':'تعذر الحفظ')}
async function aLogin(){let{error}=await sb.auth.signInWithPassword({email:ae.value,password:ap.value});if(error){am.textContent='تعذر الدخول';return}loadAdmin()}
async function loadAdmin(){let{data:{session}}=await sb.auth.getSession();if(!session)return;alogin.classList.add('hide');aapp.classList.remove('hide');let{data:s,error}=await sb.rpc('admin_dashboard_stats');if(error){am.textContent='لا توجد صلاحية إدارة';return}astats.innerHTML=[['المعلمون',s.teachers],['الفصول',s.classes],['المواد',s.subjects],['حصص الجدول',s.schedule_entries],['الخطط',s.plans]].map(x=>`<div class=stat><b>${x[1]}</b>${x[0]}</div>`).join('');let{data:t}=await sb.from('admin_teacher_status').select('*').order('name');alist.innerHTML=(t||[]).map(x=>`<div class=teacherItem><b>${esc(x.name)}</b> — ${x.pin_status}<button style="float:left" onclick="resetPin('${x.id}')">إعادة تعيين PIN</button></div>`).join('')}
async function resetPin(id){if(!confirm('إعادة تعيين رمز هذا المعلم؟'))return;let{error}=await sb.rpc('admin_reset_teacher_pin',{p_teacher_id:id});if(error)return alert('تعذر التنفيذ');alert('تمت إعادة التعيين. الرمز المؤقت 0000');loadAdmin()}async function aLogout(){await sb.auth.signOut();location.reload()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}sb.auth.getSession().then(x=>{if(x.data.session)loadAdmin()});init();</script></body></html>
